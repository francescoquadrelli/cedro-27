services:
  - type: web
    name: cedro-27
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 run.py
    plan: free
    region: frankfurt
    healthCheckPath: /configure
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: 3.11.11
    # Live TV does not require TMDB_KEY.
    # For movies and series, add TMDB_KEY as a secret in the Render dashboard.
